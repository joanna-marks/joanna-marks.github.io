- title: Education
  type: time_table
  contents:
    - title: PhD in Statistics and Machine Learning
      institution: Imperial College London and University of Oxford, UK
      year: 2024-now
      description:
        - Under the supervision of <a href="https://akyildiz.me/">Deniz Akyildiz</a> and <a href="https://sites.google.com/site/riccardopasseggeri">Riccardo Passeggeri</a>
        - Investigating the interplay between Optimal Transport (OT) and generative modeling, with a focus on latent variable models. Currently working with <a href="https://gabrielrioux.github.io">Gabriel Rioux</a> on developing a novel, scalable algorithm for Gromov-Wasserstein distance computation to align complex probability spaces.
        - Fully funded within the EPSRC Center for Doctoral Training in Statistics and Machine Learning (<a href="https://statml.io/">StatML CDT</a>).
        - Completed doctoral-level modules in Deep Learning, Advanced Bayesian Methods, Statistical Inference, and Causal Inference.
        # - title: Papers
        #   contents:
        #     - 1 NeurIPS paper
        #     - 1 UAI paper (Oral)
        #     - 1 AISTATS paper
        #     - 1 ICLR workshop paper
    - title: MSc. in Statistics
      institution: Imperial College London, UK
      year: 2023-2024
      description:
        - <a href="https://fundacja.orlen.pl/pl/obszary-programowe/edukacja/bona-fide">Bona Fide Scholarship</a> (Competitive scholarship awarded to top Polish studnets to partially fund their studies).
        - Thesis project supervised by Ed Cohen on "Mean-field limits for discrete-time Hawkes processes on homogeneous and inhomogeneous graph structures."
        - Modules included: Deep Learning, Machine Learning, Advanced Simulation Methods and Bayesian Methods
        - Graduated with Distinction.
    - title: BSc. in Mathematics
      institution: Universitu of Wariwck, UK
      year: 2020 - 2023
      description:
        -  Second-year project on modelling football match results.
        - Modules included: Probabilty Theory, Markov Processes, Stochastic Processes and Statistical Inference.
        - Graduated with First Class Honours.



- title: Work Experience
  type: time_table
  contents:
    - title: Quantitative Analyst (Part-time)
      institution: Amelco UK, London, UK
      year: Jul 2024 - Oct 2025
      description:
        - Helped develop <b>Python-based pricing models</b> for basketball pre-match markets, incorporating team and player strength, pace, and efficiency.
        - Helped develop a <b>time-series library</b> for fitting custom state-space models using JAX.
        - Worked with traders and product teams to translate <b>model outputs into market prices</b>, sanity checks, and risk controls; created diagnostics to monitor model performance.

- title: Research Experience
  type: time_table
  contents:
    - title: The Mary Lister McCammon Summer Research Fellow
      institution: Imperial College London, Department of Mathematics, London, UK
      year: Jul 2023 - Sep 2023
      description:
        - Developed a <b>stochastic model</b> to simulate the development of cancer cells in a joint system with lymphocyte cells.
        - Introduced an <b>interaction matrix</b> into the stochastic model to account for interactions between cancer cells and lymphocyte cells.
        - Collaborated with an MSc student to compare the stochastic model with an analogous continuous model.
        - Worked as <b>part of a cohort of fourteen fellows</b>, participated in science communication training, and presented the research to a broad audience.

    - title: Research Intern
      institution: University of Oxford, Department of Statistics, Oxford, UK
      year: Jul 2022 - Sep 2022
      description:
        - Developed and implemented a <b>mixed additive model</b> in Python to assess pass difficulty and estimate the passing ability of a football player.
        - Worked under the supervision of Professor Christl Donnelly and PhD candidate Matthew Penn.
        - Conducted independent research, implemented it on real-world data, and <b>contributed to pre-match reports</b> for Oxford City Football Club.
        - Research was mentioned in <i>Nature</i> <a href="https://www.nature.com/articles/d41586-022-03698-1">[link]</a>.
        - An article based on the model was published in <i>Significance</i>, the Royal Statistical Society's magazine: <a href="https://academic.oup.com/jrssig/article/20/6/22/7457255">[link]</a>.

    - title: Undergraduate Research Support Scheme
      institution: University of Warwick, Department of Statistics, Coventry, UK
      year: Jul 2023 - Sep 2023
      description:
        - Developed a mid-season table for the Polish volleyball league, accounting for the strength of each opponent played.
        - Worked under the supervision of Dr. Nick Tawn and Professor David Firth.


